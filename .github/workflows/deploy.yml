name: Deploy

# Cada push a main publica el sitio en Cloudflare Pages.
# Requiere dos secrets en GitHub (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   – token con permiso "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  – ID de la cuenta de Cloudflare
# Mientras no estén cargados, el workflow termina sin error y no publica.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROJECT_NAME: felix-mataitis-weddings
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: check
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::warning::Faltan los secrets de Cloudflare; se omite el deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # SITE_URL: variable del repo (Settings → Secrets and variables → Actions → Variables).
      # Cuando tengamos dominio se carga ahí, ej. https://felixmataitis.com
      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://felix-mataitis-weddings.pages.dev' }}
        run: node scripts/build.mjs

      - name: Create Pages project (si no existe)
        if: steps.check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ env.PROJECT_NAME }} --production-branch=main

      - name: Deploy to Cloudflare Pages
        if: steps.check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.PROJECT_NAME }} --branch=main
