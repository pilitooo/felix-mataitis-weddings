name: Deploy

# Cada push a main genera el sitio y lo publica en GitHub Pages (gratis, repo público).
# Dominio: felixmataitis.com (archivo public/CNAME + DNS en Namecheap).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://felixmataitis.com' }}
        run: node scripts/build.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
